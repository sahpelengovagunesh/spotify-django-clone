<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Spotify Web Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { display: flex; background-color: #000; color: #fff; height: 100vh; overflow: hidden; }
        .sidebar { width: 240px; background-color: #121212; padding: 24px 16px; display: flex; flex-direction: column; gap: 20px; }
        .sidebar h2 { color: #1db954; font-size: 24px; }
        .nav-item { color: #b3b3b3; text-decoration: none; font-weight: bold; font-size: 14px; }
        .nav-item:hover { color: #fff; }
        .main-content { flex: 1; background: linear-gradient(to bottom, #1e1e1e, #121212); padding: 20px; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-login { background-color: #fff; color: #000; border: none; padding: 10px 24px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        .card { background-color: #181818; padding: 16px; border-radius: 8px; }
        .card:hover { background-color: #282828; }
        .card-img { width: 100%; height: 150px; background-color: #333; border-radius: 4px; }
        .card h4 { margin-top: 12px; font-size: 16px; }
        .card p { color: #b3b3b3; font-size: 12px; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Spotify</h2>
        <a href="{% url 'home' %}" class="nav-item">Ana Səhifə</a>
        <a href="#" class="nav-item">Axtarış</a>
        <a href="{% url 'library' %}" class="nav-item">Kitabxana</a>
    </div>
    <div class="main-content">
        <div class="header">
            <h3>Xoş gəlmisiniz</h3>
            <button class="btn-login">Daxil ol</button>
        </div>
        <h2>Populyar Albomlar</h2>
        <br>
        <div class="grid">
            {% for album in albums %}
                <a href="{% url 'album_detail' album.id %}" style="text-decoration: none; color: inherit;">
                    <div class="card">
                        <img src="{{ album.cover_image }}" alt="{{ album.title }}" style="width:100%; height:150px; object-fit:cover; border-radius:4px;">
                        <h4>{{ album.title }}</h4>
                        <p>{{ album.artist }}</p>
                    </div>
                </a>
            {% empty %}
                <p>Hələ heç bir albom əlavə edilməyib.</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
